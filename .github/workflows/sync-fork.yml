name: sync-fork

on:
  push:
    branches:
      - main

jobs:
  sync-fork:
    # Requires a PAT with push access to Zhongshan-Big-Jun/rigorous-open-math-research.
    # Store it as FORK_PAT. Secret-dependent conditions must be evaluated in steps.
    runs-on: ubuntu-latest
    env:
      FORK_PAT: ${{ secrets.FORK_PAT }}
    steps:
      - name: Explain unavailable fork credentials
        if: ${{ env.FORK_PAT == '' }}
        run: echo "Fork sync skipped because FORK_PAT is not configured."
      - uses: actions/checkout@v4
        if: ${{ env.FORK_PAT != '' }}
        with:
          fetch-depth: 0
      - name: Push main to fork
        if: ${{ env.FORK_PAT != '' }}
        run: |
          git remote add fork "https://x-access-token:${FORK_PAT}@github.com/Zhongshan-Big-Jun/rigorous-open-math-research.git"
          git push fork main
      - name: Verify fork/main matches origin/main
        if: ${{ env.FORK_PAT != '' }}
        run: |
          git fetch fork main
          origin_head="$(git rev-parse origin/main)"
          fork_head="$(git rev-parse fork/main)"
          if [ "$origin_head" != "$fork_head" ]; then
            echo "FAIL: fork/main is at $fork_head, origin/main is at $origin_head" >&2
            exit 1
          fi
          echo "OK: fork/main == origin/main ($origin_head)"
